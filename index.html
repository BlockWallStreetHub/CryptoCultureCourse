sub:'The problem Bitcoin solved, the people who dreamed it up, and the first years of a culture that had no boss.',
html:`
<div class="box story"><h4>Story: The Headline in Block One</h4>
<p>On January 3, 2009, a computer somewhere started the Bitcoin network and created its very first block. Inside that block, the creator typed a line of text: the headline of that day’s <em>Times</em> of London newspaper, about the government preparing a second bailout for banks.</p>
<p>No speech. No press conference. No company name. Just a timestamp and a message baked into the code forever. That one move tells you almost everything about this culture: <strong>show, don’t tell. Build, don’t beg. Let the code speak.</strong></p></div>

<h3>The problem nobody could solve</h3>
<p>Before Bitcoin, people had tried for decades to make digital money. They kept hitting the same wall, called the <strong>double-spend problem</strong>.</p>
<p>Here’s the wall. A digital file can be copied perfectly. If a dollar were just a file, you could copy it and spend it twice, and so could everyone else. In the regular world, a bank or payment company solves this by sitting in the middle and keeping the books. It says, “this dollar was already spent.” But that means you must trust the middleman, and the middleman can freeze you, charge you, or fail.</p>
<p>Earlier attempts included David Chaum’s DigiCash in the 1980s and 90s, Nick Szabo’s idea called bit gold, and Adam Back’s Hashcash. Each one added a piece of the puzzle. None of them fully worked without a central company or a trusted party. Bitcoin was the first to solve it with no middleman: thousands of independent computers keep the same ledger and check each other’s work.</p>

<h3>The cypherpunks</h3>
<p>The people who laid the ground for Bitcoin were <strong>cypherpunks</strong>. In 1992, a small group in the San Francisco Bay Area started a mailing list to talk about privacy, cryptography (the math of secret codes), and freedom in the digital age. Their belief was that privacy is needed for an open society, and that you protect it with math and software, not with promises from governments or companies. Their motto was short: <strong>“Cypherpunks write code.”</strong> They didn’t just argue. They built.</p>
<p>That attitude is still the heartbeat of the culture. When someone in crypto says “ship it” or “show me the code,” they’re carrying this tradition.</p>

<h3>2008: the match gets lit</h3>
<p>In September 2008, the investment bank Lehman Brothers collapsed and the global financial system came close to freezing. Governments around the world rushed in to rescue big banks with taxpayer money. In the United States, Congress approved a bailout program of up to $700 billion. Meanwhile millions of regular families lost jobs and homes. Many people asked the same question: <em>why do the rules protect the biggest players and not the rest of us?</em></p>
<p>On <strong>October 31, 2008</strong>, someone using the name <strong>Satoshi Nakamoto</strong> posted a nine-page paper to a cryptography mailing list. Its title said it all: <em>Bitcoin: A Peer-to-Peer Electronic Cash System</em>. It described money that could be sent directly from one person to another with no bank in the middle.</p>

<ol class="timeline">
<li><b>Oct 31, 2008</b>Satoshi posts the nine-page Bitcoin whitepaper.</li>
<li><b>Jan 3, 2009</b>The first block, called the genesis block, is created with the bailout headline inside.</li>
<li><b>Jan 12, 2009</b>The first Bitcoin transaction between people: Satoshi sends 10 bitcoin to Hal Finney, an early cypherpunk and developer.</li>
<li><b>May 22, 2010</b>Bitcoin Pizza Day: a programmer, Laszlo Hanyecz, pays 10,000 bitcoin for two pizzas. It is the first known purchase of a physical item with Bitcoin.</li>
<li><b>2011</b>Satoshi stops communicating and fades from public view. Nobody has ever proven who Satoshi is.</li>
<li><b>2013</b>The word “HODL” is born from a typo in a forum post. Bitcoin passes $1,000 for the first time.</li>
<li><b>Feb 2014</b>Mt. Gox, then the biggest Bitcoin exchange, collapses after hacks and missing coins.</li>
<li><b>Dec 2017</b>Bitcoin nears $20,000, and futures begin trading in Chicago.</li>
<li><b>Nov 2021</b>Bitcoin reaches around $69,000, then falls hard in 2022.</li>
<li><b>Jan 2024</b>US spot Bitcoin ETFs begin trading.</li>
</ol>

<h3>A founder who vanished</h3>
<p>When Satoshi disappeared, Bitcoin did not die. It kept running, because nobody owned it. This is huge for the culture. There is no CEO to call, no headquarters, and no founder to worship or blame. Changes happen only when enough people who run the software agree. The culture calls this <strong>rough consensus</strong>. It makes Bitcoin people stubborn about the rules, and suspicious of anyone who says “trust me.”</p>

<h3>Early lessons the culture learned the hard way</h3>
<ul>
<li><strong>The Pizza lesson:</strong> New money can look like nothing, right up until it doesn’t. Those 10,000 bitcoin would be worth hundreds of millions of dollars at later prices. But nobody knew in 2010, and that’s the point: early belief took patience and risk.</li>
<li><strong>The Silk Road lesson:</strong> An online black market called Silk Road used Bitcoin from 2011 until it was shut down in 2013. For years, many outsiders thought Bitcoin was only for crime. A tool is not defined by its worst users, but reputations stick, and the culture has been fighting that image ever since.</li>
<li><strong>The Mt. Gox lesson:</strong> When a giant exchange collapsed in 2014, many people who had left their coins on it lost them. This is where one of the culture’s golden rules gained force: <strong>not your keys, not your coins.</strong> Holding your own keys means no company can lose your money for you.</li>
<li><strong>The HODL lesson:</strong> In December 2013, a forum user posted a rambling message titled with a misspelling of “holding.” People laughed, then adopted it. HODL became a creed: hold through the storms instead of selling in fear.</li>
</ul>

<div class="box simple"><h4>Say it simple</h4><p>Bitcoin was invented to solve a digital money problem without a middleman, by people who believed in privacy and building instead of begging. It arrived right after the 2008 bank bailouts, came from a creator who vanished, and grew into a culture with no boss and a deep suspicion of anyone who says “just trust me.”</p></div>

<div class="box take"><h4>Key takeaways</h4><ul>
<li>The double-spend problem is why digital cash failed for decades before Bitcoin.</li>
<li>Cypherpunks, starting in 1992, believed in protecting privacy with code. “Cypherpunks write code.”</li>
<li>The 2008 crisis and bailouts lit the match. The whitepaper came Oct 31, 2008 and the first block Jan 3, 2009.</li>
<li>Satoshi disappeared in 2011, so Bitcoin has no boss and runs on rough consensus.</li>
<li>Pizza Day, Silk Road, HODL, and Mt. Gox each taught the culture a lasting lesson.</li>
</ul></div>
`,

sub:'The core values underneath the memes: verify, scarcity, self-custody, open access, and patience.',
html:`
<div class="box story"><h4>Story: The Node in the Closet</h4>
<p>Imagine a guy named Dre. He works a regular job, nothing fancy. In his closet sits a small, cheap computer running Bitcoin software. It downloads every transaction ever made and checks each one against the rules, all by itself.</p>
<p>A friend asks, “Why bother? Just check a website.” Dre says, “Because then I’m trusting the website. This way I don’t have to trust anybody. I check it myself.”</p>
<p>That small act, running your own copy and checking the rules yourself, is the most Bitcoin thing there is. It captures the whole culture in one idea: <strong>don’t trust, verify.</strong></p></div>

<p>Slang and memes are the surface of crypto culture. Underneath are a handful of beliefs. If you understand these, you can understand why people in this space argue the way they do, and why they get so passionate. Here are the big ones.</p>

<h3>1. Don’t trust, verify</h3>
<p>In the regular financial world, you trust: you trust the bank’s statement, the government’s numbers, the company’s promises. In Bitcoin culture, the goal is to replace trust with checking. Bitcoin’s software is <strong>open source</strong>, meaning anyone can read it. Anyone can run a <strong>node</strong>, which is a computer that downloads the whole ledger and checks that every rule is followed. If someone tries to cheat, the nodes reject it.</p>
<p>This belief also applies to people. A confident influencer is not proof of anything. The culture’s healthy instinct is: <em>show me the evidence, not just the story.</em></p>

<h3>2. Scarcity and sound money</h3>
<p>Bitcoin has a fixed supply: <strong>21 million coins, ever</strong>. That limit is written into the rules, and the nodes enforce it. New bitcoin enter the world through mining, and about every four years the reward for miners is cut in half in an event called the <strong>halving</strong>.</p>
<table>
<tr><th>Halving</th><th>Reward per block</th></tr>
<tr><td>Start, 2009</td><td>50 bitcoin</td></tr>
<tr><td>2012</td><td>25 bitcoin</td></tr>
<tr><td>2016</td><td>12.5 bitcoin</td></tr>
<tr><td>2020</td><td>6.25 bitcoin</td></tr>
<tr><td>2024</td><td>3.125 bitcoin</td></tr>
</table>
<p>Over 19 million of the 21 million are already mined, and the last one is expected around the year 2140. People who care about this call Bitcoin <strong>sound money</strong> or <strong>hard money</strong>: money that cannot be inflated by someone’s decision. Compare it with the dollar, where the Federal Reserve and the government can create more. For this culture, a hard cap is not a technical detail. It’s a moral stance: <em>no one gets to dilute your savings.</em></p>

<h3>3. Own your keys</h3>
<p>A <strong>wallet</strong> holds your <strong>private key</strong>, the secret code that lets you spend your Bitcoin. A <strong>seed phrase</strong> of 12 or 24 words can rebuild your wallet. If you hold your keys, you practice <strong>self-custody</strong>. If a company holds them for you, you have an IOU from that company.</p>
<p>After Mt. Gox and many later collapses, “not your keys, not your coins” became a rule of the culture. Self-custody is freedom, and it is also responsibility. Lose your seed phrase and nobody can restore it. Share it and someone can empty you.</p>

<h3>4. Permissionless and open to everyone</h3>
<p>You don’t need a permission slip, a credit score, or a bank branch to use Bitcoin. If you have a phone and internet, you can receive or send value at any hour, any day of the year, to anyone in the world. This is called being <strong>permissionless</strong>. For people who have been turned away by banks, charged high fees, or cut off from services, this is not an abstract idea.</p>

<h3>5. No boss, rough consensus, and the right to say no</h3>
<p>Because nobody runs Bitcoin, the people running nodes have real power. The clearest example came in the “block size wars” of 2016 and 2017, when a loud group wanted to change Bitcoin’s rules to allow bigger blocks. Many node operators and users refused. A group split off in August 2017 and created a separate coin called Bitcoin Cash. The original Bitcoin kept its rules and kept the name. For the culture, the lesson was powerful: <strong>users, not companies or famous figures, decide the rules.</strong></p>

<h3>6. Low time preference: patience as a value</h3>
<p>“Time preference” is an economics idea about how much you want things now versus later. Someone with <strong>high time preference</strong> wants it now: spend today, flex today. Someone with <strong>low time preference</strong> is willing to wait for a bigger payoff later: save today, build today. A lot of Bitcoin culture is a celebration of low time preference. That’s the thinking behind “stack sats,” buying small amounts steadily, and holding for years instead of days.</p>

<h3>7. Privacy and censorship resistance</h3>
<p>Cypherpunk roots mean privacy is a core value. <strong>Censorship resistance</strong> means nobody can block a valid transaction, freeze your account, or stop you from using your money. Supporters see it as protection for journalists, protesters, people in unstable countries, and anyone who wants to keep their financial life their own business. Critics worry about crime. Both arguments exist in the culture, and you should know both.</p>

<h3>8. Ideas over personalities</h3>
<p>Satoshi stayed anonymous on purpose. Many builders still use nicknames. The idea is that the code and the evidence should stand by themselves, without a celebrity vouching for them. In practice, crypto also has plenty of loud personalities, and that contradiction is part of the culture too.</p>

<h3>Money as stored time and energy</h3>
<p>One idea we teach at Block Wall Street connects all of these: <strong>money is stored time and energy.</strong> When you work, you trade hours of your life for dollars. Those dollars are a way of saving your effort so you can use it later. If your money loses buying power to inflation, some of your stored time quietly disappears. A hard-capped money, in this view, protects the hours of life you put into earning. That’s why the culture talks about “saving in Bitcoin” and “taking back your time.”</p>

<h3>Important: not everyone shares these beliefs</h3>
<p>“Bitcoiner” and “crypto person” are not the same thing. Many people in crypto care mostly about quick profits, and don’t care about keys, scarcity, or decentralization. Many newer coins are run by companies or small groups who can change the rules at will. As a learner, your job is to ask: <em>is this project actually living these values, or just borrowing the language?</em></p>

<div class="box simple"><h4>Say it simple</h4><p>Crypto culture runs on a few big beliefs: verify instead of trusting, respect scarcity, hold your own keys, keep the doors open to everyone, let users decide the rules, think long-term, and protect privacy. Learn these and the slang and arguments stop being confusing.</p></div>

<div class="box take"><h4>Key takeaways</h4><ul>
<li>Don’t trust, verify: open-source code and nodes you can run yourself.</li>
<li>Scarcity: 21 million cap, and the halving cuts new supply about every four years.</li>
<li>Self-custody: your keys, your coins. A seed phrase must never be shared.</li>
<li>Permissionless: no bank, no credit check, open 24/7.</li>
<li>Users decide the rules, as the 2017 block size wars and Bitcoin Cash split showed.</li>
<li>Low time preference means patience. Money is stored time and energy.</li>
<li>Not every crypto project actually lives these values.</li>
</ul></div>

sub:'Slang, memes, and code words, and how to read a crypto post without getting played.',
html:`
<div class="box story"><h4>Story: “GM, Fren”</h4>
<p>Keisha joined a crypto chat for the first time. The first message she saw was “gm gm gm.” Then: “ser, wagmi, just aped in, nfa dyor.” Then somebody replied “ngmi, you’re exit liquidity.” She thought the whole room was speaking another language.</p>
<p>It was. And like any language, once you learn a few key phrases, the room opens up. The danger is the opposite: people who learn the slang fast can start <em>sounding</em> like insiders long before they <em>know</em> anything. This section gives you the words, and the habit of reading between the lines.</p></div>

<p>Crypto slang came from forums, chat rooms, and social media, mixed with humor, inside jokes, and a lot of loyalty. Tap each one to open it. Learn them in groups.</p>

<h3>Greetings and community words</h3>
<div class="slang">
<details><summary>GM / GN</summary><p><strong>Good morning / good night.</strong> People post it all day, in every time zone. It’s a ritual that says “I’m here, I’m part of this.” It sounds trivial, but belonging is a big part of the culture.</p></details>
<details><summary>WAGMI</summary><p><strong>“We’re all gonna make it.”</strong> Community optimism. It is a hope and a joke at the same time. Be careful: nobody can promise everyone makes it.</p></details>
<details><summary>NGMI</summary><p><strong>“Not gonna make it.”</strong> A put-down aimed at people who panic-sold, fell for a scam, or made a silly move. It can be playful, but it can also be mean.</p></details>
<details><summary>LFG</summary><p><strong>“Let’s go!”</strong> A hype shout. You’ll see it right after good news or a big price move.</p></details>
<details><summary>Ser / Anon / Fren</summary><p><strong>Ser</strong> is a playful “sir.” <strong>Anon</strong> means anonymous person: many people online use nicknames and avatars. <strong>Fren</strong> is “friend” with a silly spelling. These show the culture’s mix of anonymity, humor, and friendliness.</p></details>
<details><summary>Orange-pill</summary><p>To <strong>“orange-pill”</strong> someone is to introduce them to Bitcoin so they understand it. Orange is Bitcoin’s color. The phrase has a bit of a religious-conversion feel, which is part of why outsiders sometimes find the culture intense.</p></details>
</div>

<h3>Bitcoin-specific words</h3>
<div class="slang">
<details><summary>HODL</summary><p>From a 2013 typo of “hold.” It means holding through price swings instead of selling in fear. People joke that it means “hold on for dear life.”</p></details>
<details><summary>Stack sats / Stacking</summary><p>Buying small amounts of Bitcoin regularly. A <strong>sat</strong> (satoshi) is one hundred-millionth of a bitcoin, so anybody can “stack,” even with $10.</p></details>
<details><summary>Not your keys, not your coins</summary><p>If a company holds the keys, they control your crypto. Self-custody is the answer.</p></details>
<details><summary>Number go up</summary><p>A joke about people who only care about price. It also carries a warning: if price is your only reason for being here, every dip will shake you out.</p></details>
<details><summary>Digital gold</summary><p>A nickname for Bitcoin: scarce, durable, and hard to fake, but easier to move than gold.</p></details>
<details><summary>Maxi</summary><p>Short for <strong>maximalist</strong>. A Bitcoin maxi believes Bitcoin is the only crypto that matters. Other coins are called <strong>altcoins</strong>, and some maxis call them “shitcoins.”</p></details>
</div>

<h3>Market words</h3>
<div class="slang">
<details><summary>Bull market / Bear market</summary><p><strong>Bull:</strong> a long stretch of rising prices and optimism. <strong>Bear:</strong> a long stretch of falling prices and fear. A deep, long bear market is nicknamed a <strong>crypto winter</strong>.</p></details>
<details><summary>ATH / ATL</summary><p><strong>All-time high</strong> and <strong>all-time low.</strong> “We’re at ATH” means a record price.</p></details>
<details><summary>Pump / Dump</summary><p>A <strong>pump</strong> is a fast price rise. A <strong>dump</strong> is a fast drop. A <strong>pump-and-dump</strong> is a scheme where insiders hype a coin, then sell to the crowd that rushes in.</p></details>
<details><summary>Moon / Wen moon</summary><p>“To the moon” means a huge price increase. “Wen moon?” (when moon) is a joke about people who ask when they’ll get rich.</p></details>
<details><summary>Rekt</summary><p>Slang for “wrecked.” You got liquidated, hacked, or lost big.</p></details>
<details><summary>Buy the dip</summary><p>Buying after a price drop, hoping it recovers. Sometimes it works, sometimes it’s catching a falling knife.</p></details>
<details><summary>Diamond hands / Paper hands</summary><p><strong>Diamond hands</strong> hold through anything. <strong>Paper hands</strong> sell at the first scare. Note how the language rewards holding and shames selling, even when selling might be the smart move.</p></details>
<details><summary>Whale / Shrimp</summary><p>A <strong>whale</strong> holds a huge amount, enough to move the market. A <strong>shrimp</strong> holds very little.</p></details>
<details><summary>Bags / Bagholder</summary><p>Your <strong>bag</strong> is what you hold. A <strong>bagholder</strong> is stuck holding something that crashed.</p></details>
<details><summary>FOMO / FUD</summary><p><strong>FOMO</strong> is fear of missing out: the itch to buy because it’s going up. <strong>FUD</strong> is fear, uncertainty, and doubt: negative noise that is sometimes real, sometimes spread to shake people out. Learning to tell the difference is a survival skill.</p></details>
</div>

<h3>Risk and degen words</h3>
<div class="slang">
<details><summary>Degen</summary><p>Short for “degenerate.” Someone who makes big, wild, high-risk bets, often on new coins. Used as a joke, a badge, and sometimes a warning.</p></details>
<details><summary>Ape in</summary><p>To jump into a trade fast and without research. It is the opposite of “learn before you buy.”</p></details>
<details><summary>Memecoin</summary><p>A coin built on a joke, a dog, a frog, or a trend, powered by attention instead of usefulness. Some people profit. Most don’t. Treat it as a casino, not a savings plan.</p></details>
<details><summary>Rug pull</summary><p>When a project’s creators take everyone’s money and vanish.</p></details>
<details><summary>Exit liquidity</summary><p>When you buy a coin from insiders who are selling. You’re their way out. Someone telling you “you’re exit liquidity” means you’re the one providing the cash for them to cash out.</p></details>
<details><summary>Alpha</summary><p>A secret edge or inside tip. If someone is giving it away free, ask why.</p></details>
<details><summary>Shill</summary><p>To promote a coin, often for pay or because the promoter owns it. A <strong>shill</strong> is someone doing that.</p></details>
<details><summary>Rekt / Liquidated</summary><p>When you borrow to trade and the price moves against you, the platform forces a sale of your position. That’s <strong>liquidation</strong>. It is the number one way leveraged traders get wiped out.</p></details>
</div>

<h3>The two phrases people use to dodge responsibility</h3>
<div class="box warn"><h4>DYOR and NFA</h4>
<p><strong>DYOR</strong> means “do your own research.” <strong>NFA</strong> means “not financial advice.” Both sound responsible. And in the best case, they are: research really is your job. But they are also used as shields. A promoter hypes a coin, adds “NFA, DYOR,” and then says nothing is on them if you lose. When you see these, don’t treat them as proof of honesty. Treat them as a reminder that <em>you</em> carry the risk.</p></div>

<h3>How to decode a post</h3>
<table>
<tr><th>The post says</th><th>What it likely means</th></tr>
<tr><td>“gm anons, just aped in, wagmi 🚀”</td><td>Greeting, then: I bought a lot quickly without research, and I’m hyping it up.</td></tr>
<tr><td>“Early alpha, 100x potential, NFA”</td><td>Promo language. Ask: who owns it, who’s paid, and what happens if you’re wrong?</td></tr>
<tr><td>“You’re ngmi if you sold”</td><td>Shame aimed at people who sell. Remember selling is sometimes the sensible choice.</td></tr>
<tr><td>“Bitcoin fixes this”</td><td>A Bitcoin maxi slogan: the claim that hard, open money solves a problem.</td></tr>
<tr><td>“Few understand this”</td><td>A flattering line meant to make you feel special for agreeing. Look for the actual reason.</td></tr>
<tr><td>“Don’t sell, just HODL”</td><td>A strong belief. Ask whether it fits <em>your</em> timeline, bills, and risk.</td></tr>
</table>

<div class="box simple"><h4>Our rule for slang</h4><p>Learn the words so you can read the room. Then use the one question that cuts through all of it: <strong>who gets paid if I believe this?</strong></p></div>

<div class="box take"><h4>Key takeaways</h4><ul>
<li>Slang builds belonging, but sounding like an insider isn’t the same as knowing.</li>
<li>Bitcoin words: HODL, stack sats, not your keys not your coins, maxi, orange-pill.</li>
<li>Market words: bull and bear, ATH, pump and dump, FOMO, FUD, whale, bag.</li>
<li>Risk words: degen, ape in, memecoin, rug pull, exit liquidity, alpha, shill, liquidation.</li>
<li>DYOR and NFA are real advice and also popular shields. Ask who gets paid.</li>
</ul></div>
`,

SECS.push({id:'s4',title:'THE TRIBES AND THE ERAS',short:'Tribes & eras',mins:12,
sub:'Who’s who in crypto, how the culture changed from 2009 to today, and where it all lives online.',
html:`
<div class="box story"><h4>Story: Three Friends, Three Worlds</h4>
<p>Marcus, Tasha, and Dee all got into crypto in the same year, but ended up in totally different places.</p>
<p>Marcus found a Bitcoin podcast and started stacking small amounts every Friday. He doesn’t care about other coins. Tasha got pulled into DeFi, lending and borrowing on apps with no bank. Dee found memecoin chats, and spends nights chasing the next thing that might jump 100 times.</p>
<p>Same industry, three cultures. When they talk, they barely understand each other. If you know which tribe someone is in, you know how to read what they say.</p></div>

<h3>The main tribes</h3>
<table>
<tr><th>Tribe</th><th>What they believe</th><th>Watch out for</th></tr>
<tr><td>Bitcoin maximalists</td><td>Bitcoin is the only real crypto. It is money, and the rest is noise.</td><td>Can dismiss useful ideas outside Bitcoin, and be harsh to newcomers.</td></tr>
<tr><td>Ethereum and smart-contract builders</td><td>Blockchains should run apps, loans, and markets, not only hold money.</td><td>Complex products and hidden risks in new protocols.</td></tr>
<tr><td>DeFi users</td><td>Banking without banks: lend, borrow, trade, and earn yield on-chain.</td><td>Smart-contract bugs, hacks, and yields that are too good to be true.</td></tr>
<tr><td>Memecoin traders (“degens”)</td><td>Attention is the asset. Culture is the product. Speed wins.</td><td>Extreme volatility, rug pulls, and insiders selling to you.</td></tr>
<tr><td>Institutions and ETF people</td><td>Wall Street wants in, with regulated products and big money.</td><td>A tool built for freedom now also sold by the old system, often with fees.</td></tr>
<tr><td>Builders, educators, and community organizers</td><td>Crypto should lift people who were left out of the old system.</td><td>Hard work and little hype. This is the lane Block Wall Street lives in.</td></tr>
</table>

<h3>More neighborhoods</h3>
<ul>
<li><strong>Stablecoin people.</strong> Stablecoins like USDT (Tether) and USDC (Circle) aim to stay worth $1. They’re used to move dollars quickly across the world and as the “cash” inside crypto markets. People in this world care about payments, remittances, and regulation.</li>
<li><strong>Privacy coin supporters.</strong> Projects like Zcash and Monero focus on private transactions. They sit close to the original cypherpunk spirit, and also get extra attention from regulators.</li>
<li><strong>Other networks.</strong> Solana, XRP, Avalanche, and many others each have their own communities, loyalties, and culture. Some are fiercely loyal. Some are mostly about marketing.</li>
<li><strong>Traditional finance crossovers.</strong> Banks, asset managers, and fintech companies now join the conversation and bring their own language: “custody,” “allocation,” “risk-adjusted returns.”</li>
</ul>
<div class="box simple"><h4>How we teach it</h4><p>At Block Wall Street we start with Bitcoin as the foundation, and we study other networks like Ethereum, Solana, XRP, Avalanche, and Zcash as tools, with open eyes. Learning how something works is not the same as endorsing it. Every network gets the same test: who controls it, what is the risk, and who gets paid if you believe it?</p></div>

<h3>The eras: how the culture changed</h3>
<ol class="timeline">
<li><b>2009 to 2012: The cypherpunk era</b>A tiny group of developers and believers. Bitcoin is worth almost nothing. Culture: technical, idealistic, skeptical.</li>
<li><b>2013 to 2016: Exchanges and early adopters</b>Bitcoin passes $1,000. Mt. Gox rises and collapses in 2014. The first conferences, podcasts, and forums appear. Ethereum launches in 2015, created by Vitalik Buterin and others, bringing smart contracts. In 2016, a hack of an Ethereum project called The DAO leads to a split between Ethereum and Ethereum Classic.</li>
<li><b>2017: The ICO boom and the scaling wars</b>“Initial coin offerings” let anyone launch a token and raise money, and many were scams or failures. Bitcoin Cash splits off in August. Bitcoin nears $20,000 in December, and Chicago’s exchanges launch Bitcoin futures. Then comes a long 2018 bear market, with prices down roughly 80 percent from the peak.</li>
<li><b>2020: DeFi summer and institutions arrive</b>Lending and trading apps boom. Companies begin putting Bitcoin on their balance sheets. A software company, MicroStrategy, starts buying in August 2020 and makes it a public strategy.</li>
<li><b>2021: NFTs, memecoins, and the peak</b>Digital art and collectibles (NFTs) go mainstream. Joke coins like Dogecoin and Shiba Inu explode. Bitcoin reaches around $69,000 in November.</li>
<li><b>2022: The collapse year</b>Terra/Luna in May and FTX in November wipe out huge amounts of money. Bitcoin falls roughly 75 percent from its peak. The culture goes through a hard reckoning about trust and custody.</li>
<li><b>2024: ETFs and the fourth halving</b>US spot Bitcoin ETFs begin trading in January. The halving follows in April. Wall Street now holds Bitcoin through regulated products.</li>
<li><b>2025 and after: Institutions and governments take notice</b>In March 2025, the US government announced a Strategic Bitcoin Reserve. Banks, asset managers, and companies keep expanding crypto offerings. The culture splits again: some celebrate the legitimacy, some worry that Bitcoin is being absorbed by the same system it was made to escape.</li>
</ol>

<h3>The big cultural tension</h3>
<p>Crypto started as a rebellion against big finance. Today, big finance sells Bitcoin ETFs. Is that a victory or a betrayal? There isn’t one correct answer. Many people hold both ideas at the same time: it’s validation that Bitcoin matters, and a risk that it becomes just another Wall Street product. Understanding this tension helps you understand many online arguments.</p>

<h3>Where the culture lives</h3>
<ul>
<li><strong>X (Twitter):</strong> the main town square for news, memes, and arguments. Also the home of many shills and scams.</li>
<li><strong>Telegram and Discord:</strong> group chats and communities. Fast, friendly, and full of impersonators, so be careful with direct messages.</li>
<li><strong>YouTube and podcasts:</strong> long-form education and opinion. Quality varies a lot.</li>
<li><strong>Conferences and meetups:</strong> in-person events, from huge conferences to local meetups. Community is the best protection, if it’s honest.</li>
<li><strong>Forums and open-source projects:</strong> where builders discuss and argue about the actual code.</li>
</ul>
<p>Chicago has its own crypto scene of meetups, classes, and builders, and our job at Block Wall Street is to make that scene welcoming and honest.</p>

<div class="box take"><h4>Key takeaways</h4><ul>
<li>Crypto is many tribes: maxis, Ethereum builders, DeFi users, degens, institutions, and community builders.</li>
<li>Learn Bitcoin first, then study other networks as tools, with the same risk test for each.</li>
<li>Eras: cypherpunks (2009 to 2012), early adopters, ICO boom (2017), DeFi (2020), NFTs and memes (2021), collapses (2022), ETFs (2024).</li>
<li>Bitcoin went from a rebel project to something Wall Street sells. People disagree on whether that’s a win.</li>
<li>Culture lives on X, Telegram, Discord, YouTube, and at meetups. Watch for impersonators.</li>
</ul></div>
`,

sub:'Hype cycles, scams, collapses, leverage, and the exclusion problem, and how to stay safe in all of it.',
html:`
<div class="box story"><h4>Story: Lena and the “Investment Coach”</h4>
<p>Lena got a friendly text from a stranger who said she had the wrong number. They kept chatting. Over weeks, the stranger became a “friend,” then a “mentor.” Eventually the friend showed her a crypto investing app that seemed to make steady profits. Lena put in $500, then $5,000, then more. The app’s screen showed her balance growing.</p>
<p>When she tried to withdraw, the site asked for a “tax” payment first. Then another fee. Then it stopped responding. Her friend disappeared. The whole app was fake, and every number on it was made up.</p>
<p>This kind of scam is real, common, and often called <strong>pig butchering</strong>, because the scammer “fattens up” trust before taking everything. Lena was not stupid. The scam was designed by professionals. Learning how they work is how you protect yourself.</p></div>

<p>We love this space, and a good teacher tells you the truth about it. Crypto has real problems, and many of them hurt the people who can least afford it. Here is the honest picture.</p>

<h3>1. Hype cycles: the boom and the bust</h3>
<p>Crypto prices tend to move in huge waves. Prices rise, headlines scream, influencers shout, newcomers buy near the top, and then prices fall hard. We covered it already, but it’s worth repeating because it repeats: Bitcoin fell roughly 80 percent after the 2017 peak and roughly 75 percent after the 2021 peak. Smaller coins often fall far more, and many never come back.</p>
<p>The cycle feeds on emotion. At the top, everyone feels smart and nobody wants to sell. At the bottom, everyone feels foolish and nobody wants to buy. A plan made before the emotions hit, like buying a small fixed amount on a schedule, protects you from both.</p>

<h3>2. The big collapses</h3>
<table>
<tr><th>Collapse</th><th>What happened</th><th>Lesson</th></tr>
<tr><td>Mt. Gox (2014)</td><td>The biggest Bitcoin exchange of its time lost huge numbers of customer coins after hacks and failures.</td><td>Not your keys, not your coins.</td></tr>
<tr><td>BitConnect (2018)</td><td>A “lending program” promising fixed daily returns collapsed. It worked like a Ponzi scheme.</td><td>Guaranteed returns are a red flag.</td></tr>
<tr><td>Terra/Luna (May 2022)</td><td>An algorithmic stablecoin called UST lost its $1 peg and the connected coin crashed, erasing tens of billions of dollars.</td><td>If you can’t explain how the yield is made, you may be the yield.</td></tr>
<tr><td>FTX (Nov 2022)</td><td>A major exchange failed, and customer funds had been misused. Its founder, Sam Bankman-Fried, was convicted of fraud in 2023.</td><td>Counterparty risk is real. A famous name is not proof of safety.</td></tr>
</table>
<p>The common thread: money held by someone else, and promises that sounded too good. Even in 2022, many of those who survived were the ones who held their own keys.</p>

<h3>3. Scams to know by name</h3>
<ul>
<li><strong>Pig butchering:</strong> a long con built on friendship or romance that ends in a fake investment site.</li>
<li><strong>Fake giveaways and “double your coins”:</strong> impersonators of famous people promise to send back more than you send. Nobody does that.</li>
<li><strong>Phishing:</strong> fake websites, emails, and texts built to steal passwords or seed phrases.</li>
<li><strong>Fake support:</strong> someone messages you pretending to be help desk and asks for your seed phrase. <strong>Real support never asks.</strong></li>
<li><strong>Address poisoning:</strong> a scammer sends a tiny transaction from an address that looks almost like one you used, hoping you copy the wrong address next time. Always verify the full address.</li>
<li><strong>Rug pulls and pump-and-dumps:</strong> new coins that creators abandon or insiders dump on the crowd.</li>
<li><strong>Recovery scams:</strong> after you lose money, someone offers to “recover” it for a fee. It’s another scam.</li>
<li><strong>Fake wallet or exchange apps:</strong> copies of real apps that steal your keys. Only download from the official source, and check the web address carefully.</li>
</ul>

<h3>4. Leverage and casino behavior</h3>
<p><strong>Leverage</strong> means trading with borrowed money to make bigger bets. At 10 times leverage, a 10 percent move against you can wipe out your whole stake, and the platform sells your position. That’s <strong>liquidation</strong>. Leverage is why some people lose their savings in a single night. The same tool exists on traditional futures exchanges in Chicago, where professionals use it with rules and risk systems. For a beginner, it is one of the fastest ways to lose everything.</p>
<p>Crypto also runs 24 hours a day, 7 days a week. That makes it easy to stay glued to charts, lose sleep, and treat investing like gambling. If you notice that you’re checking the price constantly, chasing losses, or hiding it from people you love, take that seriously and step back. Help exists, and there is no shame in it.</p>

<h3>5. Influencers, paid promotions, and the incentive question</h3>
<p>Many “experts” are paid to promote, or hold the coin they’re pushing and benefit when you buy. Some celebrity-backed coins have collapsed and left fans holding the loss. This is the origin of “exit liquidity.” The question that cuts through nearly all of it: <strong>who gets paid if I believe this?</strong></p>

<h3>6. Exclusion and the access problem</h3>
<p>Crypto has often been loud, male-dominated, and unwelcoming to beginners and to people who don’t look like the usual crowd. At the same time, some marketing and products target communities with less access to traditional finance, which can mean higher-risk offers aimed at the people with the least room for error. Crypto ATMs, for example, often charge high fees and have been used in scams. This is one of the reasons Block Wall Street exists: to teach honestly, at a human pace, without pressure.</p>

<h3>7. Your safety checklist</h3>
<ol>
<li><strong>Never share your seed phrase.</strong> Not with support, a friend, a website, or a form.</li>
<li><strong>Write it on paper</strong> and store it somewhere safe. Don’t take a photo or store it in your notes app.</li>
<li><strong>Use a hardware wallet</strong> as your holdings grow. It keeps keys offline.</li>
<li><strong>Turn on two-factor security</strong> on exchanges, using an authenticator app instead of text messages where possible.</li>
<li><strong>Verify every address and web link.</strong> Bookmark real sites instead of clicking links in messages.</li>
<li><strong>Send a small test transaction</strong> first when moving a large amount.</li>
<li><strong>Ignore unsolicited DMs.</strong> Block and report.</li>
<li><strong>Never invest money you need for rent, food, or bills.</strong></li>
</ol>

<div class="box warn"><h4>The seven red flags</h4>
<ul>
<li>Guaranteed returns or “double your money”</li>
<li>Pressure and deadlines: “only 3 spots left”</li>
<li>A stranger who asks you to send money first</li>
<li>Anyone asking for your seed phrase or private key</li>
<li>Links in texts and DMs</li>
<li>A project you can’t explain, with yields nobody can explain either</li>
<li>Someone who makes you feel dumb for asking questions</li>
</ul></div>

<div class="box simple"><h4>Say it simple</h4><p>The dark side of crypto is hype cycles, big collapses, scams built by professionals, leverage that wipes people out, paid promoters, and unwelcoming spaces. The protection is simple: hold your own keys, never share secrets, ignore pressure, never use money you need, and always ask who gets paid if you believe it.</p></div>

<div class="box take"><h4>Key takeaways</h4><ul>
<li>Boom-and-bust cycles repeat. Bitcoin fell about 80 percent after 2017 and about 75 percent after 2021.</li>
<li>Mt. Gox, BitConnect, Terra/Luna, and FTX each teach a lesson about custody, guarantees, and hidden risk.</li>
<li>Know the scams: pig butchering, fake giveaways, phishing, fake support, address poisoning, rug pulls, recovery scams.</li>
<li>Leverage can wipe you out. A 10x position is liquidated by a 10 percent move.</li>
<li>Watch for paid promoters. Ask who gets paid if you believe it.</li>
<li>Follow the safety checklist and the seven red flags.</li>
</ul></div>

sub:'Where Block Wall Street plants its flag: price is noise, Bitcoin is infrastructure, and education beats speculation.',
html:`
<div class="box story"><h4>Story: Two Neighbors, Two Plans</h4>
<p>Ray and Monique both put $5,000 toward Bitcoin on the same day. Ray watched the price every hour. When it fell 20 percent in a week, he panicked and sold. When it climbed, he jumped back in. He told everybody he was “trading.”</p>
<p>Monique never looked at the daily price. She asked a different question: <em>who is adopting this, and is that growing?</em> She set up small, steady buys, learned how to hold her own keys, and made a rule that she would never borrow so much that a bad month could force her to sell.</p>
<p>Years later, the difference wasn’t about luck. It was about what each of them thought they were doing. Ray thought he was playing a trade. Monique thought she was building on infrastructure. That difference is what this section is about.</p></div>

<p>Everything so far has been the landscape. Now we say where Block Wall Street stands. These are our views. We share them as teaching and conviction, not as predictions or advice, and you should test them against your own judgment.</p>

<div class="quote">1. PRICE IS NOISE. ADOPTION IS THE SIGNAL.</div>
<p>The loudest voices in crypto watch the daily chart. We watch structure: who is building, who is adopting, which institutions are changing their rules, and how Bitcoin moves from “something people trade” into “something systems are built on.” Examples of adoption that matter to us include regulated ETFs, companies and funds holding Bitcoin, payment tools like the Lightning Network, banks and lenders accepting it as collateral, and governments studying reserves.</p>
<p>The point is not that price never matters. It’s that people who mistake price for the trend get shaken out by every dip. The trend is adoption. Price is the weather. Adoption is the climate.</p>

<div class="quote">2. BITCOIN IS INFRASTRUCTURE, NOT A TRADE.</div>
<p>A trade is something you flip. Infrastructure is something you build on, like roads, electricity, or the internet. We teach Bitcoin as a long-term base layer for savings, collateral, payments, and community wealth. That’s why we say <strong>accumulate, don’t trade.</strong> Trading takes skill, time, emotional control, and usually fees and taxes. Most people who try it lose to the market and to their own feelings. Accumulating takes patience and a plan.</p>

<div class="quote">3. DON’T SELL. COLLATERALIZE.</div>
<p>This is one of our most advanced ideas, and it comes with real danger, so read it slowly.</p>
<p>Wealthy people often don’t sell what they own. Instead, they <strong>borrow against it</strong>. Why? Selling an asset that has gone up can trigger a tax bill on the gain, and it also means you no longer own the asset. Borrowing against it gives you cash while you keep the asset. The idea of <strong>collateralizing</strong> Bitcoin applies the same principle: you lock up Bitcoin as collateral, borrow dollars, and keep your coins. (Tax rules differ by situation. Always check with a qualified tax professional.)</p>

<h3>The mechanics, in plain numbers</h3>
<ul>
<li><strong>Collateral:</strong> the Bitcoin you lock up.</li>
<li><strong>LTV (loan-to-value):</strong> the loan divided by the value of your collateral. If you have $100,000 of Bitcoin and borrow $30,000, your LTV is 30 percent.</li>
<li><strong>Liquidation threshold:</strong> the LTV at which the lender is allowed to sell your collateral to protect itself. It varies by platform, often somewhere in the range of 70 to 80 percent on common DeFi lending platforms, but you must check the exact number for any platform you use.</li>
<li><strong>Health factor:</strong> a number some platforms show. It measures how far you are from liquidation. When it drops toward 1, you’re near the edge.</li>
</ul>
<table>
<tr><th>Scenario</th><th>Collateral value</th><th>Loan</th><th>LTV</th></tr>
<tr><td>Start</td><td>$100,000</td><td>$30,000</td><td>30%</td></tr>
<tr><td>Bitcoin falls 30%</td><td>$70,000</td><td>$30,000</td><td>about 43%</td></tr>
<tr><td>Bitcoin falls 50%</td><td>$50,000</td><td>$30,000</td><td>60%</td></tr>
<tr><td>Bitcoin falls 60%</td><td>$40,000</td><td>$30,000</td><td>75%, close to liquidation on many platforms</td></tr>
</table>
<p>Notice what low LTV buys you: <strong>room.</strong> At 30 percent, Bitcoin would need to fall deeply before you’re in danger. At 60 percent LTV to start, a modest drop could wipe out your collateral.</p>

<div class="box warn"><h4>Guardrails for collateralizing</h4>
<ul>
<li>Keep LTV low, and treat the platform’s maximum as a danger line, not a target.</li>
<li>Know your liquidation price before you borrow.</li>
<li>Keep reserves ready to add collateral or repay quickly in a crash.</li>
<li>Never borrow to gamble or to buy things that lose value fast.</li>
<li>Understand the platform risk: smart-contract bugs, hacks, and rule changes are real.</li>
<li>Monitor your position. Tools like alerts and health-factor trackers exist for this reason.</li>
<li>Remember that interest and fees are real costs. If you can’t explain how you will repay, don’t borrow.</li>
</ul></div>

<div class="quote">4. EDUCATION OVER SPECULATION.</div>
<p>Our goal is financial literacy and community wealth-building. We would rather you leave understanding money than leave holding a coin. If you can explain it to another person, you really own it. That’s why our courses include stories, quizzes, calculators, and study guides, and why we say things like “learn before you buy.”</p>

<div class="quote">5. MONEY IS STORED TIME AND ENERGY.</div>
<p>When you earn, you convert hours of your life into dollars. When inflation or bad decisions erode those dollars, you lose stored time. This view is why we talk about savings, ownership, and long-term thinking. It’s also why we teach people how many hours of work a given amount of money represents. Taking back your time is taking back your life.</p>

<div class="quote">6. BUILD COMMUNITY, NOT JUST PORTFOLIOS.</div>
<p>Wealth that only one person holds disappears easily. Wealth passed down, taught, and shared with a community lasts. We explore ideas like family-level Bitcoin savings, community education, and shared learning clubs. These are concepts we study and teach, with clear rules: educational first, no pooling of other people’s money without proper legal structure and advice. Through our nonprofit arm, Building 4 Our Future Foundation, we focus on financial literacy and helping entrepreneurs in underserved communities.</p>

<h3>What we do not do</h3>
<ul>
<li>We do not promise returns.</li>
<li>We do not tell you what to buy.</li>
<li>We do not hide the risks. If something is dangerous, we say so, including our own favorite ideas.</li>
<li>We do not treat selling as shameful, or holding as a guarantee of safety.</li>
</ul>

<h3>The BWS habits, in one list</h3>
<ol>
<li>Learn before you buy.</li>
<li>Cover the basics first: budget, emergency fund, no high-interest debt.</li>
<li>Buy small amounts on a schedule you can keep.</li>
<li>Hold your own keys as your stack grows.</li>
<li>Watch adoption, not hourly price.</li>
<li>If you borrow, borrow small and plan for a crash.</li>
<li>Teach someone else.</li>
</ol>

<div class="box simple"><h4>Say it simple</h4><p>We see Bitcoin as infrastructure to build on, not a trade to flip. Price is noise and adoption is the signal. Collateralizing instead of selling can be powerful, but only with low LTV and a plan for a crash. Education beats speculation, and community beats solo winning.</p></div>

<div class="box take"><h4>Key takeaways</h4><ul>
<li>Price is the weather. Adoption is the climate.</li>
<li>Accumulate, don’t trade. Infrastructure, not a trade.</li>
<li>Collateralizing means borrowing against Bitcoin so you keep your coins, and it works only with guardrails.</li>
<li>LTV is loan divided by collateral value. Lower LTV means more room before liquidation.</li>
<li>Money is stored time and energy.</li>
<li>Education over speculation, and community over solo wins. No promises, no advice.</li>
</ul></div>

sub:'Why this story belongs to Chicago: Black Wall Street, the policy game, the futures exchanges, and a Chicago son who built on Bitcoin.',
html:`
<div class="box story"><h4>Story: A Bank on State Street</h4>
<p>In the early 1900s, Black Chicagoans were arriving by train from the South, part of what we call the Great Migration. They found jobs and some freedom, and they also found locked doors. Many white-owned banks would not serve them. Landlords charged them more. Neighborhood rules and lending practices kept them boxed into the South Side’s “Black Belt.”</p>
<p>So they built their own. A man named Jesse Binga opened Binga State Bank in 1908. Robert Abbott’s newspaper, the <em>Chicago Defender</em>, told the community’s story and called Black Southerners north. Black-owned insurance companies, stores, and banks lined the streets of what became known as Bronzeville.</p>
<p>Those institutions mattered. But the Great Depression struck, and Binga’s bank failed in 1930. People who kept their savings there lost money. It’s a hard lesson, and it echoes something the crypto world says every day: <strong>when your money sits inside someone else’s institution, their failure can become yours</strong>, even when that institution is run by your own community.</p></div>

<h3>Why Chicago matters to this culture</h3>
<p>Crypto culture says “build your own rails.” Black Chicago’s history says the same thing. The tools are different, but the instinct is old: when the system won’t serve you, you build something of your own. This section ties together four pieces of Chicago’s story: <strong>Bronzeville and Black Wall Street</strong>, <strong>the policy game</strong>, <strong>the futures exchanges</strong>, and <strong>a Chicago-born Bitcoin builder</strong>.</p>

<h3>1. Bronzeville and the Black Metropolis</h3>
<ul>
<li><strong>Banks and insurance:</strong> Binga State Bank, the Douglass National Bank, and insurance companies like Supreme Liberty Life gave Black families access to savings, loans, and protection that the mainstream often denied.</li>
<li><strong>Media:</strong> The <em>Chicago Defender</em> (1905) and other papers connected and informed the community.</li>
<li><strong>Housing barriers:</strong> Practices like redlining and racially restrictive covenants limited where Black families could buy and how they could borrow. These were not accidents. They shaped who built wealth for generations.</li>
<li><strong>The point:</strong> Wealth is built through ownership, credit, and institutions. When those are blocked, communities fall behind, not because of talent, but because of access.</li>
</ul>
<p>You may also hear the name “Black Wall Street.” That nickname is most famous for the Greenwood district of Tulsa, Oklahoma, a thriving Black business district destroyed in the 1921 Tulsa Race Massacre. It has become a symbol of Black economic power and of how it can be taken. Chicago’s Bronzeville had its own version of that story. And yes, our name, Block Wall Street, is a nod to it and to the blockchain.</p>

<h3>2. The policy game</h3>
<p>The <strong>policy game</strong> was a numbers lottery that thrived in Chicago’s Black neighborhoods from the early 1900s on. Players bet small amounts, often a nickel or a dime, on numbers. It was illegal, yet for decades it was a huge business. Some of its bosses, known as “policy kings,” included the Jones brothers and Teddy Roe, and they reinvested a lot of money in community businesses, charity, and jobs when mainstream banks were not lending. Others point out that the game also took money from people who could least afford to lose it.</p>
<p>Why does it matter here? Two reasons. First, it shows how much capital a community can generate when it has no access to banks, and how much that money can build when it stays at home. Second, the policy game looks a lot like today’s <strong>memecoin and gambling culture</strong>: small bets, big dreams, and a house that usually wins. We use the comparison to teach, and we’ve explored ideas like no-loss prize savings, which keep the excitement of a prize draw but remove the risk of losing your principal. They’re concepts to study, not products we’re selling.</p>

<h3>3. Chicago: the home of futures</h3>
<p>Chicago has been the world’s risk-management capital since the 1800s. A <strong>futures contract</strong> is an agreement to buy or sell something at a set price on a future date. Picture a farmer who wants to lock in a price for wheat before harvest, and a baker who wants to lock in the price he’ll pay. Futures let both sides plan. Speculators join, betting on where prices will go, and they provide the liquidity that makes the market work.</p>
<table>
<tr><th>Exchange</th><th>Quick facts</th></tr>
<tr><td>Chicago Board of Trade (CBOT)</td><td>Founded in 1848. It grew around grain trading and became the home of standardized futures.</td></tr>
<tr><td>Chicago Mercantile Exchange (CME)</td><td>Began in 1898 as a butter and egg market and was renamed the CME in 1919. It later merged with the CBOT in 2007.</td></tr>
<tr><td>Cboe (Chicago Board Options Exchange)</td><td>Founded in 1973 as the first marketplace for listed options. It later launched the VIX, a famous measure of market fear.</td></tr>
</table>

<div class="box story"><h4>Story: Sunday Night, December 10, 2017</h4>
<p>Bitcoin had just blown past $10,000 and was heading toward nearly $20,000. That Sunday evening, the Cboe Futures Exchange in Chicago began trading the first bitcoin futures on a regulated US exchange, under the ticker <strong>XBT</strong>. A week later, on December 18, the CME launched its own bitcoin futures.</p>
<p>For the first time, Wall Street could trade Bitcoin without owning a single coin. The contracts were cash-settled, which means traders bet on the price and settled in dollars. Cboe’s contract was based on the auction price from the Gemini exchange. For many people, this was the first time the traditional system treated Bitcoin as real enough to put a ticker on.</p></div>

<p>For much of the finance world, the Cboe and CME launches were the front door to Bitcoin. They also taught a key lesson: <strong>futures let you bet on a price without ever owning the asset.</strong> That’s the opposite of “own your keys.” We respect the history, and we teach the difference between <em>trading a price</em> and <em>holding Bitcoin</em>. Futures also use leverage, which can wipe people out fast. The path from these futures to the spot Bitcoin ETFs of 2024 is a straight line: each step brought more regulated products and more institutional money.</p>

<h3>4. Jack Mallers: a Chicago son in Bitcoin</h3>
<p>If Chicago’s exchanges are the old system, Jack Mallers is what happens when that world’s kid picks up Bitcoin.</p>
<ul>
<li><strong>Who he is:</strong> Founder and CEO of <strong>Strike</strong>, a payments app built on Bitcoin’s Lightning Network. Born in Chicago in 1994 and raised in Evanston, he started building Bitcoin software as a young man, launching Zap in 2017 and Strike in 2020.</li>
<li><strong>Where he comes from:</strong> A Chicago trading family. His grandfather, William Mallers Sr., became chairman of the Chicago Board of Trade as the youngest ever to hold that seat, and is credited with helping to get the Chicago Board Options Exchange started. His father, William Jr., ran a major futures brokerage and bought his first bitcoin in 2013. Jack grew up with futures in his family history, then chose Bitcoin.</li>
<li><strong>What Lightning is:</strong> a second layer built on top of Bitcoin for fast, cheap payments. Strike lets people send and receive money in dollars, while Lightning moves the value in the background.</li>
<li><strong>His big moment:</strong> In June 2021, at a Bitcoin conference in Miami, he announced that El Salvador planned to make Bitcoin legal tender, and he had worked with the country’s president on the effort. He has spoken about Bitcoin as a tool for people who are locked out of, or burdened by, the old system.</li>
<li><strong>His voice:</strong> A strongly Bitcoin-first view, and an outspoken one against what he calls the monopoly power of the big payment networks.</li>
</ul>
<div class="box simple"><h4>What he represents</h4>
<p>Mallers stands for the <strong>bridge</strong> between worlds: Chicago trading-floor knowledge meeting Bitcoin’s open network. He represents the idea that you can come from the heart of the old financial system and still decide the new rails are better. He also represents the push to make Bitcoin not just something you hold, but something you can <em>spend</em> and <em>send</em> in everyday life.</p>
<p>For us, he’s also a reminder that Bitcoin’s builders aren’t only in Silicon Valley. Some of the most important figures are from our own city. Like anyone in this space, he has his own views and business interests, so learn from him the way you’d learn from anyone: with respect, and with your own judgment.</p></div>

<h3>Putting it together</h3>
<p>Bronzeville shows what a community builds when it’s locked out. The policy game shows how much capital our neighborhoods generate and how easily it can leak. The exchanges show Chicago’s power in markets and risk. Jack Mallers shows a Chicagoan carrying that knowledge into Bitcoin. And crypto culture, at its best, says: <em>we can build rails nobody can lock us out of.</em></p>
<p>That’s why we teach crypto the way we do: slowly, honestly, and with a focus on ownership, collateral, community funds, and financial literacy that gets passed down.</p>

<h3>How to walk in</h3>
<ol>
<li><strong>Learn before you buy.</strong> Understand money, inflation, and Bitcoin first.</li>
<li><strong>Cover the basics.</strong> Budget, emergency fund, no high-interest debt.</li>
<li><strong>Start small and steady.</strong> A small, regular amount you can leave alone beats a big bet you’ll panic about.</li>
<li><strong>Protect your keys.</strong> Never share your seed phrase. Be suspicious of every DM.</li>
<li><strong>Follow builders, not hype.</strong> Ask who benefits from what you’re hearing.</li>
<li><strong>Find your people.</strong> Community is the best protection, as long as it’s honest.</li>
<li><strong>Teach somebody.</strong> The more people who understand, the stronger the circle.</li>
</ol>

<div class="box warn"><h4>Important</h4><p>This is education, not financial advice. Crypto is high risk and prices swing hard. Only use money you can afford to leave alone, and talk to a licensed professional about your own situation.</p></div>

<div class="box take"><h4>Key takeaways</h4><ul>
<li>Black Chicagoans built Bronzeville’s banks, insurers, and newspapers when mainstream finance shut them out. Binga’s bank failed in 1930, a lesson on trusting someone else’s institution.</li>
<li>The policy game shows how much capital the community generated, and resembles modern degen gambling.</li>
<li>CBOT (1848), CME (1898 origins), and Cboe (1973) made Chicago the home of futures. Bitcoin futures launched at Cboe on Dec 10, 2017 and at CME on Dec 18.</li>
<li>Futures bet on price without owning the asset, the opposite of self-custody.</li>
<li>Jack Mallers, born in Chicago, built Strike on the Lightning Network and represents a bridge between old finance and Bitcoin.</li>
</ul></div>

<div class="pager"><button class="btn ghost" data-go="s7">← Back: Chicago</button><button class="btn ghost" data-go="welcome">Back to start</button></div>`;
}

function mount(){
  const views=[];
  views.push(`<div class="view" id="v-welcome">${buildWelcome()}</div>`);
  SECS.forEach((s,i)=>views.push(`<div class="view" id="v-${s.id}">${buildSection(s,i)}</div>`));
  views.push(`<div class="view" id="v-final">${buildFinal()}</div>`);
  app.innerHTML=views.join('');
  $('#map').innerHTML=SECS.map((s,i)=>`<li><button data-go="${s.id}"><span class="n">${i+1}</span><span class="t">${s.title}<small>${s.sub}</small></span><span class="m">~${s.mins} min</span></button></li>`).join('')+
   `<li><button data-go="final"><span class="n">★</span><span class="t">THE FINAL EXAM<small>${FINAL.length} questions across the whole course. Pass to earn your certificate.</small></span><span class="m">~15 min</span></button></li>`;
  const pills=[['welcome','Start'],...SECS.map((s,i)=>[s.id,(i+1)+'. '+s.short]),['final','Final exam']];
  $('#pills').innerHTML=pills.map(([id,l])=>`<button class="pill" data-go="${id}" data-pill="${id}">${l}</button>`).join('');
  SECS.forEach(s=>mountQuiz($('#quiz-'+s.id),s.quiz,s.id,{title:'QUIZ: '+s.short.toUpperCase(),shuffleQs:false,next:nextTarget(s.id)}));
  mountQuiz($('#quiz-final'),FINAL,'final',{title:'FINAL EXAM',shuffleQs:true,next:null,final:true});
}
function nextTarget(id){const i=SECS.findIndex(s=>s.id===id);return i<SECS.length-1?SECS[i+1].id:'final';}

function passed(key){
  if(key==='final')return state.final!==null&&state.final>=Math.ceil(FINAL.length*PASS);
  const s=SECS.find(x=>x.id===key);return state.scores[key]!==undefined&&state.scores[key]>=Math.ceil(s.quiz.length*PASS);
}

function show(id,noScroll){
  $$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+id));
  state.view=id;save();
  if(!noScroll)window.scrollTo(0,0);
  if(id==='final'){renderScores();renderCert();}
  refreshChrome();
}
function refreshChrome(){
  $$('.pill').forEach(p=>{const id=p.dataset.pill;p.classList.toggle('on',id===state.view);p.classList.toggle('done',id!=='welcome'&&passed(id));});
  const n=SECS.filter(s=>passed(s.id)).length+(passed('final')?1:0);
  $('#prog i').style.width=(n/(SECS.length+1)*100)+'%';
  const on=$('.pill.on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'});
}
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(go){e.preventDefault();show(go.dataset.go);return;}
  const jp=e.target.closest('[data-jump]');
  if(jp){e.preventDefault();$('#quiz-'+jp.dataset.jump).scrollIntoView({behavior:'smooth'});}
});

/* ---- generic quiz engine ---- */
function mountQuiz(el,qs,key,opts){
  const L=['A','B','C','D'];
  let order,i,score,missed;
  function start(){order=opts.shuffleQs?shuffle(qs.map((_,k)=>k)):qs.map((_,k)=>k);i=0;score=0;missed=[];render();}
  function render(){
    if(i>=order.length)return result();
    const q=qs[order[i]];
    const opt=shuffle(q.o.map((t,k)=>({t:t,ok:k===0})));
    el.innerHTML=`<h3 class="qh">${opts.title}</h3><div class="qcount">Question ${i+1} of ${order.length} · Correct so far: ${score}</div><div class="qbar"><i style="width:${i/order.length*100}%"></i></div><div class="qq"></div><div class="opts"></div><div class="fb"></div>`;
    $('.qq',el).textContent=q.q;
    const box=$('.opts',el);
    opt.forEach((o,k)=>{
      const b=document.createElement('button');b.className='opt';
      b.innerHTML='<span class="l">'+L[k]+'</span><span></span>';
      b.lastChild.textContent=o.t;
      b.onclick=()=>pick(q,opt,k);
      box.appendChild(b);
    });
  }
  function pick(q,opt,k){
    const ok=opt[k].ok;if(ok)score++;else missed.push(q);
    $$('.opt',el).forEach((b,j)=>{b.disabled=true;if(opt[j].ok)b.classList.add('right');else if(j===k)b.classList.add('wrong');});
    const fb=$('.fb',el);
    fb.innerHTML=`<div class="why ${ok?'':'bad'}"><strong>${ok?'Correct.':'Not quite.'}</strong> <span></span></div><button class="btn" id="nx">${i<order.length-1?'Next question →':'See my score →'}</button>`;
    $('span',$('.why',fb)).textContent=q.w;
    const nx=$('#nx',fb);nx.focus({preventScroll:true});
    nx.onclick=()=>{i++;render();el.scrollIntoView({behavior:'smooth'});};
  }
  function result(){
    const total=order.length,need=Math.ceil(total*PASS),ok=score>=need;
    const prev=key==='final'?state.final:state.scores[key];
    const best=Math.max(prev||0,score);
    if(key==='final')state.final=best;else state.scores[key]=best;
    save();refreshChrome();
    if(opts.final){renderScores();renderCert();}
    const pct=Math.round(score/total*100);
    const msg=pct>=90?"You’ve got this locked in. That’s real knowledge.":pct>=70?"Solid work. Review what you missed below and you’re there.":"No stress. Scroll up, re-read the section, and run it back. That’s how it sticks.";
    let rev='';
    if(missed.length){rev='<div class="review"><h4>What you missed</h4>'+missed.map((q,n)=>`<details><summary>${n+1}. ${esc(q.q)}</summary><p><strong>Answer:</strong> ${esc(q.o[0])}</p><p>${esc(q.w)}</p></details>`).join('')+'</div>';}
    el.innerHTML=`<h3 class="qh">${opts.final?'EXAM':'QUIZ'} DONE</h3>
<div class="score">${score}<span style="font-size:2.2rem;color:var(--mute)"> / ${total}</span></div>
<p><span class="badge ${ok?'pass':'fail'}">${pct}% · ${ok?'PASSED':'Pass mark is '+need+' of '+total}</span> <span class="badge">Best: ${best} / ${total}</span></p>
<p style="font-size:1.1rem">${msg}</p>
<div class="row"><button class="btn ghost" id="rt">Try again</button>${opts.next?'<button class="btn" data-go="'+opts.next+'">'+(opts.next==='final'?'Go to the final exam →':'Next section →')+'</button>':''}</div>${rev}`;
    $('#rt',el).onclick=()=>{start();el.scrollIntoView({behavior:'smooth'});};
  }
  start();
}

/* ===== BWS CERTIFICATE + EMAIL GRADE REPORT MODULE =====
   Shows a certificate with every section grade and the overall grade,
   and emails the same report to Block Wall Street through Web3Forms. */
const BWS_CERT={
  key:'cbde23f6-f617-4b16-953f-7b0aab0e9f58',
  url:'https://api.web3forms.com/submit',
  esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');},
  letter(p){return p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';},
  report(rows){
    let s=0,t=0;
    const out=rows.map(r=>{
      s+=r.score; t+=r.total;
      const p=Math.round(r.score/r.total*100);
      return {label:r.label,score:r.score,total:r.total,pct:p,letter:this.letter(p)};
    });
    const p=Math.round(s/t*100);
    return {rows:out,score:s,total:t,pct:p,letter:this.letter(p)};
  },
  tableHTML(rep){
    return '<table class="gradeTbl"><tr><th>Section</th><th>Score</th><th>Grade</th></tr>'
      +rep.rows.map(r=>'<tr><td>'+this.esc(r.label)+'</td><td>'+r.score+' / '+r.total+'</td><td>'+r.pct+'% ('+r.letter+')</td></tr>').join('')
      +'<tr class="ov"><td>OVERALL</td><td>'+rep.score+' / '+rep.total+'</td><td>'+rep.pct+'% ('+rep.letter+')</td></tr></table>';
  },
  certHTML(info,rep,footer){
    return '<div class="cert"><h2>CERTIFICATE OF COMPLETION</h2><p>This certifies that</p><div class="nm"></div>'
      +'<p>completed <strong>'+this.esc(info.course)+'</strong>'+(footer?'<br>'+this.esc(footer):'')+'</p>'
      +this.tableHTML(rep)
      +'<p>Overall grade: <strong>'+rep.pct+'% ('+rep.letter+')</strong> · '+info.date+'</p></div>'
      +'<div class="row"><button class="btn" onclick="window.print()">Print certificate</button></div>';
  },
  async send(info,rep){
    const lines=rep.rows.map(r=>r.label+': '+r.score+'/'+r.total+' = '+r.pct+'% ('+r.letter+')').join('\n');
    const message='Participant: '+info.name+'\nEmail: '+(info.email||'(not given)')+'\nCourse: '+info.course+'\nCompleted: '+info.date
      +'\n\nSECTION GRADES\n'+lines+'\n\nOVERALL GRADE: '+rep.score+'/'+rep.total+' = '+rep.pct+'% ('+rep.letter+')'
      +(info.extra?'\n\n'+info.extra:'');
    const body={
      access_key:this.key,
      subject:'Course completed: '+info.name+' | '+info.course+' | '+rep.pct+'% ('+rep.letter+')',
      from_name:'BWS Course Report',
      name:info.name,
      course:info.course,
      overall_grade:rep.pct+'% ('+rep.letter+')',
      message:message
    };
    if(info.email) body.email=info.email;
    const res=await fetch(this.url,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body)});
    const j=await res.json().catch(()=>({}));
    return !!(res.ok&&j.success);
  },
  /* o: {course,rows,name,email,certEl,statusEl,state,save,footer,extra} */
  async issue(o){
    const date=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
    const info={name:o.name,email:o.email,course:o.course,date:date,extra:o.extra};
    const rep=this.report(o.rows);
    o.certEl.innerHTML=this.certHTML(info,rep,o.footer);
    o.certEl.querySelector('.nm').textContent=o.name;
    const sig=JSON.stringify([o.name,o.email,o.rows.map(r=>r.score)]);
    const st=o.statusEl;
    if(o.state.sentSig===sig){st.innerHTML='<p class="cstat ok">✓ Your grades were already emailed to Block Wall Street.</p>';return rep;}
    st.innerHTML='<p class="cstat">Sending your grades to Block Wall Street…</p>';
    let ok=false;
    try{ok=await this.send(info,rep);}catch(e){ok=false;}
    if(ok){o.state.sentSig=sig;o.save();st.innerHTML='<p class="cstat ok">✓ Your section grades and overall grade were emailed to Block Wall Street.</p>';}
    else{st.innerHTML='<p class="cstat bad">Your certificate is ready, but the email did not go through. Check your internet and tap the button again.</p>';}
    return rep;
  }
};

/* ---- scores + certificate ---- */
function renderScores(){
  const list=SECS.map((s,i)=>`<p style="margin:.3rem 0"><strong>${i+1}. ${s.short}:</strong> ${state.scores[s.id]!==undefined?state.scores[s.id]+' / '+s.quiz.length:'<span style="color:var(--mute)">not taken yet</span>'}</p>`).join('');
  const f=state.final!==null?`<p style="margin:.8rem 0 0"><strong>Final exam best:</strong> ${state.final} / ${FINAL.length}</p>`:'<p style="margin:.8rem 0 0;color:var(--mute)">Final exam not taken yet</p>';
  $('#scoreList').innerHTML=list+f;
}
function renderCert(){
  const w=$('#certWrap');
  if(!passed('final')){w.innerHTML='';return;}
  const missing=SECS.filter(s=>state.scores[s.id]===undefined);
  if(missing.length){w.innerHTML='<div class="box warn"><h4>One more step</h4><p>You passed the final exam. To get your certificate, also take the quiz for: '+missing.map(s=>esc(s.short)).join(', ')+'.</p></div>';return;}
  w.innerHTML=`<h3>Get your certificate</h3><p>You passed the final exam. Type your name and email, then tap the button. Your certificate will appear below, and your grade for each section plus your overall grade will be emailed to Block Wall Street.</p>
<div class="row"><input class="nameIn" id="nameIn" placeholder="Your name" aria-label="Your name"><input class="nameIn" id="emailIn" type="email" placeholder="Your email (optional)" aria-label="Your email"></div>
<div class="row" style="margin-top:0"><button class="btn" id="mkCert">Make my certificate</button></div>
<p class="privacy">When you make your certificate, your name, email and scores are sent to Block Wall Street.</p>
<div id="certStatus" aria-live="polite"></div><div id="certOut"></div>`;
  $('#nameIn').value=state.name||''; $('#emailIn').value=state.email||'';
  $('#mkCert').onclick=()=>{
    const st=$('#certStatus');
    const name=($('#nameIn').value||'').trim(), email=($('#emailIn').value||'').trim();
    if(!name){st.innerHTML='<p class="cstat bad">Please type your name first.</p>';$('#nameIn').focus();return;}
    state.name=name;state.email=email;save();
    const rows=SECS.map(s=>({label:s.short,score:state.scores[s.id],total:s.quiz.length})).concat([{label:'Final exam',score:state.final,total:FINAL.length}]);
    BWS_CERT.issue({
      course:'Crypto Culture: The Block Wall Street Introduction',
      footer:'Final exam passed ('+Math.round(state.final/FINAL.length*100)+'%)',
      rows:rows,name:name,email:email,certEl:$('#certOut'),statusEl:st,state:state,save:save,
      extra:'Grades use the participant\'s best score on each quiz. Pass mark is 70%.'
    });
  };
}

/* ---- toolbar ---- */
function applyPrefs(){document.documentElement.style.fontSize=state.fs+'px';document.documentElement.setAttribute('data-theme',state.theme);}
$('#fsm').onclick=()=>{state.fs=Math.max(14,state.fs-1);applyPrefs();save();};
$('#fsp').onclick=()=>{state.fs=Math.min(28,state.fs+1);applyPrefs();save();};
$('#theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';applyPrefs();save();};

mount();applyPrefs();
show(state.view&&$('#v-'+state.view)?state.view:'welcome',true);
</script>
